# ============================================
# Hermes VPS Cluster - Master Config Template
# Version: 3.0.0 (API Mode)
# ============================================

# NOTE: This file is for reference only.
# The setup script (setup-master.sh) handles configuration automatically.
# You do NOT need to manually edit config.yaml for inter-bot communication.

# Workers are configured in ~/.hermes/workers.json
# Skills use the API server directly (no MCP needed)

# Example workers.json:
# {
#   "workers": [
#     {
#       "name": "bot2",
#       "ip": "203.0.113.10",
#       "port": 8642,
#       "api_key": "your-api-key-here",
#       "enabled": true
#     },
#     {
#       "name": "bot3",
#       "ip": "203.0.113.11",
#       "port": 8642,
#       "api_key": "your-api-key-here",
#       "enabled": true
#     }
#   ]
# }

# ============================================
# Worker API Server Config (on each worker VPS)
# ============================================
# Add to worker's ~/.hermes/.env:
#
# API_SERVER_ENABLED=true
# API_SERVER_PORT=8642
# API_SERVER_HOST=0.0.0.0
# API_SERVER_KEY=your-api-key-here
